# ============================================
# IMRAG - GitLab CI/CD Pipeline
# MANUAL ONLY - No auto-run on push
# ============================================

stages:
  - mock
  - track

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/infrastructure/terraform

# ============================================
# MOCK STAGES - Generate fake pipeline logs for testing
# ============================================
mock_deploy:
  stage: mock
  image: alpine:latest
  script:
    - echo "🎭 MOCK MODE - Simulating infrastructure deployment..."
    - echo ""
    - echo "[$(date -Iseconds)] Starting mock terraform apply..."
    - sleep 2
    - echo "[$(date -Iseconds)] azurerm_resource_group.main Refreshing state..."
    - sleep 1
    - echo "[$(date -Iseconds)] azurerm_storage_account.release Creating..."
    - sleep 3
    - echo "[$(date -Iseconds)] azurerm_storage_account.release Creation complete after 3s"
    - echo "[$(date -Iseconds)] azurerm_storage_account.ci Creating..."
    - sleep 2
    - echo "[$(date -Iseconds)] azurerm_storage_account.ci Creation complete after 2s"
    - echo "[$(date -Iseconds)] azurerm_container_group.ci Creating..."
    - sleep 4
    - echo "[$(date -Iseconds)] azurerm_container_group.ci Creation complete after 4s"
    - echo ""
    - echo "INFRA_CHANGE $(date -Iseconds) ACTION apply STATUS success TEAM all RESOURCES 6 PIPELINE ${CI_PIPELINE_ID} USER ${GITLAB_USER_LOGIN}"
    - echo ""
    - echo "✅ Mock deployment complete!"
    - echo "Apply complete! Resources 6 added, 0 changed, 0 destroyed."
  rules:
    - if: $ACTION == "mock_deploy"
      when: always
    - when: never

mock_scale_up:
  stage: mock
  image: alpine:latest
  script:
    - echo "🎭 MOCK MODE - Simulating scale UP operation..."
    - echo ""
    - echo "[$(date -Iseconds)] Starting mock scale up..."
    - echo "[$(date -Iseconds)] Current config cpu=0.25, memory=0.5"
    - echo "[$(date -Iseconds)] Target config cpu=0.5, memory=1.0"
    - sleep 2
    - echo "[$(date -Iseconds)] azurerm_container_group.ci Modifying..."
    - sleep 3
    - echo "[$(date -Iseconds)] azurerm_container_group.ci Modifications complete"
    - echo ""
    - echo "INFRA_CHANGE $(date -Iseconds) ACTION scale_up STATUS success TEAM ci-team RESOURCES cpu=0.5,memory=1.0 EST_COST_CHANGE +5/month PIPELINE ${CI_PIPELINE_ID} USER ${GITLAB_USER_LOGIN}"
    - echo ""
    - echo "✅ Mock scale up complete!"
  rules:
    - if: $ACTION == "mock_scale_up"
      when: always
    - when: never

mock_scale_down:
  stage: mock
  image: alpine:latest
  script:
    - echo "🎭 MOCK MODE - Simulating scale DOWN operation..."
    - echo ""
    - echo "[$(date -Iseconds)] Starting mock scale down..."
    - echo "[$(date -Iseconds)] Current config cpu=0.5, memory=1.0"
    - echo "[$(date -Iseconds)] Target config cpu=0.25, memory=0.5"
    - sleep 2
    - echo "[$(date -Iseconds)] azurerm_container_group.ci Modifying..."
    - sleep 2
    - echo "[$(date -Iseconds)] azurerm_container_group.ci Modifications complete"
    - echo ""
    - echo "INFRA_CHANGE $(date -Iseconds) ACTION scale_down STATUS success TEAM ci-team RESOURCES cpu=0.25,memory=0.5 EST_COST_CHANGE -3/month PIPELINE ${CI_PIPELINE_ID} USER ${GITLAB_USER_LOGIN}"
    - echo ""
    - echo "✅ Mock scale down complete!"
  rules:
    - if: $ACTION == "mock_scale_down"
      when: always
    - when: never

mock_destroy:
  stage: mock
  image: alpine:latest
  script:
    - echo "🎭 MOCK MODE - Simulating infrastructure destroy..."
    - echo ""
    - echo "[$(date -Iseconds)] Starting mock terraform destroy..."
    - sleep 1
    - echo "[$(date -Iseconds)] azurerm_linux_function_app.cloudops Destroying..."
    - sleep 2
    - echo "[$(date -Iseconds)] azurerm_linux_function_app.cloudops Destruction complete"
    - echo "[$(date -Iseconds)] azurerm_container_group.ci Destroying..."
    - sleep 3
    - echo "[$(date -Iseconds)] azurerm_container_group.ci Destruction complete"
    - echo "[$(date -Iseconds)] azurerm_storage_account.release Destroying..."
    - sleep 2
    - echo "[$(date -Iseconds)] azurerm_storage_account.release Destruction complete"
    - echo ""
    - echo "INFRA_CHANGE $(date -Iseconds) ACTION destroy STATUS success TEAM all EST_COST_CHANGE -15/month PIPELINE ${CI_PIPELINE_ID} USER ${GITLAB_USER_LOGIN}"
    - echo ""
    - echo "✅ Mock destroy complete!"
    - echo "Destroy complete! Resources 0 added, 0 changed, 6 destroyed."
  rules:
    - if: $ACTION == "mock_destroy"
      when: always
    - when: never

mock_failed_deploy:
  stage: mock
  image: alpine:latest
  script:
    - echo "🎭 MOCK MODE - Simulating FAILED deployment..."
    - echo ""
    - echo "[$(date -Iseconds)] Starting mock terraform apply..."
    - sleep 2
    - echo "[$(date -Iseconds)] azurerm_resource_group.main Refreshing state..."
    - sleep 1
    - echo "[$(date -Iseconds)] azurerm_storage_account.release Creating..."
    - sleep 2
    - echo "[$(date -Iseconds)] Error creating Storage Account"
    - echo "[$(date -Iseconds)] Error Code=StorageAccountAlreadyTaken"
    - echo ""
    - echo "INFRA_CHANGE $(date -Iseconds) ACTION apply STATUS failed TEAM release-team ERROR StorageAccountAlreadyTaken PIPELINE ${CI_PIPELINE_ID} USER ${GITLAB_USER_LOGIN}"
    - echo ""
    - echo "❌ Mock deployment FAILED!"
    - exit 1
  rules:
    - if: $ACTION == "mock_failed_deploy"
      when: always
    - when: never
  allow_failure: true

cost_estimate:
  stage: mock
  image: alpine:latest
  script:
    - echo "📊 Generating infrastructure cost estimate..."
    - echo ""
    - echo "Estimated Monthly Costs:"
    - echo "  - Release Team Storage   1.00 USD"
    - echo "  - CI Team Container      9.00 USD"
    - echo "  - CloudOps Function      5.50 USD"
    - echo "  -------------------------"
    - echo "  TOTAL                   15.50 USD/month"
    - echo ""
    - echo "PIPELINE_LOG $(date -Iseconds) STAGE cost_estimate STATUS success EST_TOTAL 15.50/month"
  rules:
    - if: $ACTION == "cost_estimate"
      when: always
    - when: never

# ============================================
# TRACK STAGES - Record local operations
# ============================================
track_apply:
  stage: track
  image: alpine:latest
  script:
    - echo "Recording local terraform apply..."
    - echo "INFRA_CHANGE $(date -Iseconds) ACTION apply STATUS success TEAM all PIPELINE ${CI_PIPELINE_ID} USER ${GITLAB_USER_LOGIN} MODE local"
    - echo "✅ Local apply recorded in GitLab"
  rules:
    - if: $ACTION == "track_apply"
      when: always
    - when: never

track_scale_up:
  stage: track
  image: alpine:latest
  script:
    - echo "Recording local scale UP operation..."
    - echo "INFRA_CHANGE $(date -Iseconds) ACTION scale_up STATUS success TEAM ci-team EST_COST_CHANGE +5/month PIPELINE ${CI_PIPELINE_ID} USER ${GITLAB_USER_LOGIN} MODE local"
    - echo "✅ Local scale up recorded in GitLab"
  rules:
    - if: $ACTION == "track_scale_up"
      when: always
    - when: never

track_scale_down:
  stage: track
  image: alpine:latest
  script:
    - echo "Recording local scale DOWN operation..."
    - echo "INFRA_CHANGE $(date -Iseconds) ACTION scale_down STATUS success TEAM ci-team EST_COST_CHANGE -3/month PIPELINE ${CI_PIPELINE_ID} USER ${GITLAB_USER_LOGIN} MODE local"
    - echo "✅ Local scale down recorded in GitLab"
  rules:
    - if: $ACTION == "track_scale_down"
      when: always
    - when: never
