# ============================================
# COST ESTIMATE
# ============================================
cost_estimate:
  stage: validate
  image: alpine:latest
  script:
    - echo "💰 Generating infrastructure cost estimate..."
    - echo ""
    - |
      cat << EOF > cost_report.json
      {
        "timestamp": "$(date -Iseconds)",
        "pipeline_id": "${CI_PIPELINE_ID}",
        "triggered_by": "${GITLAB_USER_LOGIN}",
        "estimated_monthly_cost": {
          "total": 15.50,
          "by_team": {
            "release-team": {
              "storage_account": 1.00,
              "total": 1.00
            },
            "ci-team": {
              "storage_account": 1.00,
              "container_instance": 8.00,
              "total": 9.00
            },
            "cloudops-team": {
              "storage_account": 1.00,
              "function_app": 2.00,
              "app_service_plan": 2.50,
              "total": 5.50
            }
          }
        }
      }
      EOF
    - cat cost_report.json
    - echo ""
    - echo "PIPELINE_LOG: $(date -Iseconds) | STAGE: cost_estimate | STATUS: success | EST_TOTAL: $$15.50/month"
  artifacts:
    paths:
      - cost_report.json
    expire_in: 30 days
  rules:
    - if: $ACTION == "cost_estimate"
